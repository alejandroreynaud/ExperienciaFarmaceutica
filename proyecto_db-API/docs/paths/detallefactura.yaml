# docs/paths/detalle-facturas.yaml
/detallefacturas/{id}:
  get:
    summary: Obtener detalle de factura por Id
    tags: [DetalleFacturas]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Detalle encontrado
      "404":
        description: Detalle no encontrado

/detalle-facturas/factura/{id_factura}:
  get:
    summary: Obtener detalles por Id de factura maestro
    tags: [DetalleFacturas]
    parameters:
      - in: path
        name: id_factura
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: Lista de detalles recuperada