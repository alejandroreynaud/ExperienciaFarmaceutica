/ventas:
  get:
    summary: Obtener ventas por fecha
    tags: [Ventas]

    parameters:
      - in: query
        name: fecha
        required: false
        schema:
          type: string
          example: "2026-03-19"

    responses:
      "200":
        description: Lista de ventas
        content:
          application/json:
            example:
              status: 200
              data: []

      "204":
        description: No se encontraron ventas

      "500":
        description: Error del servidor


/ventas/{id}:
  get:
    summary: Obtener venta por ID
    tags: [Ventas]

    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer

    responses:
      "200":
        description: Venta encontrada
        content:
          application/json:
            example:
              status: 200
              data:
                id: 1

      "204":
        description: Venta no encontrada

      "500":
        description: Error del servidor

