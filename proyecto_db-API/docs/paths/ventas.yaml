/ventas:
  get:
    summary: Obtener ventas por fecha
    tags: [Ventas]

    parameters:
      - in: query
        name: fecha
        required: false
        schema:
          type: string
          example: "2026-03-19"

    responses:
      "200":
        description: Lista de ventas
        content:
          application/json:
            example:
              status: 200
              data: []

      "204":
        description: No se encontraron ventas

      "500":
        description: Error del servidor

  post:
    summary: Crear una venta
    tags: [Ventas]

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id_vendedor:
                type: integer
                example: 1
              id_cliente:
                type: integer
                example: 1
              total:
                type: number
                example: 150.5
              metodo_pago:
                type: string
                example: "efectivo"
              estado:
                type: boolean
                example: true
              fecha:
                type: string
                example: "2026-03-19"

    responses:
      "200":
        description: Venta creada correctamente

/ventas/{id}:
  get:
    summary: Obtener venta por ID
    tags: [Ventas]

    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer

    responses:
      "200":
        description: Venta encontrada
        content:
          application/json:
            example:
              status: 200
              data:
                id: 1

      "204":
        description: Venta no encontrada

      "500":
        description: Error del servidor

