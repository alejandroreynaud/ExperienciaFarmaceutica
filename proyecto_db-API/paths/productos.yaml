openapi: 3.0.3
info:
  title: API Farmacia - Productos
  description: Endpoints para gestión de productos del sistema de farmacia
  version: 1.0.0

tags:
- name: Productos
  description: Gestión de productos

paths:

  /productos:
    post:
      tags: [ Productos ]
      summary: Crear producto
      description: Crea un nuevo producto. El nombre y el código deben ser únicos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ nombre, codigo ]
              properties:
                nombre:
                  type: string
                  example: Paracetamol 500mg
                codigo:
                  type: string
                  example: PARA-500
                imagen:
                  type: string
                  nullable: true
                  example: https://example.com/paracetamol.jpg
      responses:
        '201':
          description: Producto creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Producto creado exitosamente
                  status:
                    type: integer
                    example: 201
                  data:
                    $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/400'
        '409':
          description: Conflicto — el nombre o código ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: El producto ya existe
        '500':
          $ref: '#/components/responses/500'

    get:
      tags: [ Productos ]
      summary: Obtener todos los productos
      description: Retorna la lista completa de productos registrados.
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Productos obtenidos exitosamente
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Producto'
        '500':
          $ref: '#/components/responses/500'

  /productos/nombre/{nombre}:
    get:
      tags: [ Productos ]
      summary: Obtener producto por nombre
      description: Retorna un producto buscando por nombre exacto.
      parameters:
      - name: nombre
        in: path
        required: true
        schema:
          type: string
        example: Paracetamol 500mg
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Producto obtenido exitosamente
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'

  /productos/{id}:
    patch:
      tags: [ Productos ]
      summary: Actualizar producto
      description: >
        Actualiza nombre, imagen o código de un producto. Solo se actualizan los campos que se envíen. No se puede enviar codigo vacío si el producto ya tiene uno asignado.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Paracetamol 1g
                codigo:
                  type: string
                  example: PARA-1G
                imagen:
                  type: string
                  example: https://example.com/nueva-imagen.jpg
      responses:
        '200':
          description: Producto actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Producto actualizado exitosamente
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: El nombre o código ya pertenece a otro producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          $ref: '#/components/responses/500'

  /productos/{id}/desactivar:
    patch:
      tags: [ Productos ]
      summary: Desactivar producto (soft delete)
      description: >
        Marca el producto como inactivo sin eliminarlo. No se puede desactivar si el producto tiene lotes activos con stock mayor a 0.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: Producto desactivado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Producto desactivado exitosamente
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      codigo:
                        type: string
                        example: PARA-500
                      nombre:
                        type: string
                        example: Paracetamol 500mg
                      activo:
                        type: boolean
                        example: false
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: El producto ya está inactivo, o tiene lotes activos con stock
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 409
                  message:
                    type: string
                    example: No se puede desactivar el producto porque tiene 2 lote(s) activo(s) con stock disponible. Cierra o agota los lotes antes de desactivarlo
        '500':
          $ref: '#/components/responses/500'

# ─── Componentes reutilizables ────────────────────────────────────────────────

components:

  schemas:

    Producto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Paracetamol 500mg
        codigo:
          type: string
          example: PARA-500
        imagen:
          type: string
          nullable: true
          example: https://example.com/paracetamol.jpg
        activo:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-02-26T21:27:26.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-03-15T00:01:00.000Z'

    ErrorMessage:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer

  responses:

    '400':
      description: Solicitud inválida — faltan campos o tienen formato incorrecto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Faltan campos obligatorios
            status: 400

    '404':
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Producto no encontrado
            status: 404

    '500':
      description: Error interno del servidor
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Error interno del servidor
              status:
                type: integer
                example: 500
              error:
                type: string
                example: Detalle técnico del error
