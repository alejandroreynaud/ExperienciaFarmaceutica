services:
  db:
    image: postgres:15
    container_name: container_proyecto
    restart: always
    ports:
      - "5430:5432"
    env_file:
      - proyecto_db-API/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyecto_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build: ./proyecto_db-API
    container_name: proyecto_api
    restart: always
    command: sh -c "npm install --include=dev && npm run db:migrate && npm start"
    ports:
      - "3008:3000"
    env_file:
      - proyecto_db-API/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./proyecto_db-API:/app
      - backend_node_modules:/app/node_modules

  frontend:
    image: node:20
    container_name: proyecto_frontend
    working_dir: /app
    restart: always
    command: sh -c "npm install; npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
      VITE_BACKEND_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    depends_on:
      - backend
    volumes:
      - ../frontend/ExperienciaFarmaceuticaFrontend/vite-project:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
