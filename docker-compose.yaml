services:
  db:
    image: postgres:15
    container_name: container_proyecto
    restart: always
    ports:
      - "5430:5432"
    env_file:
      - proyecto_db-API/.env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expfarma}
      POSTGRES_DB: ${DB_NAME:-proyecto_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./proyecto_db-API
    container_name: proyecto_api
    restart: always
    command: sh -c "npm install; npm start"
    ports:
      - "3008:3000"
    env_file:
      - proyecto_db-API/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./proyecto_db-API:/app
      - backend_node_modules:/app/node_modules

volumes:
  db_data:
  backend_node_modules:
